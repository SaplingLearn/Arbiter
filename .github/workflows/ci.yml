name: CI
on: [push, pull_request]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      # PYTHON IS PART OF THE UPLOAD PATH, not a data-prep convenience. `services/api`
      # shells out to data/prep/measure_pdf.py and extract_pdf_text.py for every
      # document uploaded, so a runner without them answers every upload with
      # 422 unreadable "PyMuPDF is not installed" - which is what CI did from the
      # moment the Read & mark tab landed, on tests that pass on any machine that has
      # ever run the data prep.
      #
      # PyMuPDF ALONE, pinned to the version in data/prep/requirements.txt, rather than
      # the whole file: the other entries there are the offline dataset toolchain
      # (rdkit, pandas, scikit-learn) which no server path touches and which cost
      # minutes to install. If a server path ever shells out to a script needing more
      # than fitz, this list grows - it is not "the requirements file minus what is
      # slow", it is "what the product needs at runtime".
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pymupdf==1.28.2
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      # The engine and the golden numbers are deterministic, so CI must be able
      # to reproduce a local number exactly. If these drift, a reported figure
      # moved and the diff has to be explained.
      - run: npm run validate:evidence
      - run: npm run harness
      - run: npm run metrics
      - run: npm test -- apps/harness/test/golden.test.ts
      - run: git diff --exit-code results/verdict-manifest.json
      # Both frontends have to build. `npm run e2e` below only exercises their dev
      # servers, so without these a production build could break and the job would
      # still be green.
      - run: npm run landing:build
      - run: npm run deliberate:build
      # Cached because it is the slowest step in the job by an order of magnitude:
      # --with-deps apt-installs system libraries on a cold runner, which took
      # 12m24s against the ~2m the rest of the job needs. The key is pinned to the
      # lockfile so a Playwright version bump invalidates it.
      - uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium
      # The browser binary is cached but the OS libraries are not, so they are
      # installed separately on a hit. Skipping this entirely makes the e2e run
      # fail on a fresh runner image with a missing shared library.
      - if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium
      # THE PRODUCT CANNOT BOOT WITHOUT AN IDENTITY. apps/deliberation no longer asks
      # anyone to sign in (App.tsx: "NO SIGN-IN. The landing page opens straight into
      # the product") - it signs itself in as r.okafor@arbiter.demo, and that account
      # only exists once this has run. Without it the app renders "Cannot open the
      # record" and every e2e assertion about the product is really an assertion about
      # a failed login. Writes results/deliberation-log.jsonl.users.json, which is the
      # same store server.ts reads, so it has to happen before the servers start.
      - run: npm run seed:demo
      - run: npm run e2e
