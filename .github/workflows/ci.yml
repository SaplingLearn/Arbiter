name: CI
on: [push, pull_request]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      # The engine and the golden numbers are deterministic, so CI must be able
      # to reproduce a local number exactly. If these drift, a reported figure
      # moved and the diff has to be explained.
      - run: npm run validate:evidence
      - run: npm run harness
      - run: npm run metrics
      - run: npm test -- apps/harness/test/golden.test.ts
      - run: git diff --exit-code results/verdict-manifest.json
      # THE PYTHON HALF, which npm does not touch and which CI did not run until
      # 2026-08-10. Two of these suites guard claims nothing else protects:
      # test_qsar_leakage.py protects the fixed-before-fitting split, which is the
      # condition under which every reported number is valid at all, and
      # test_leakage_screen.py protects the nonclinical/clinical blindness the
      # prediction scoring rests on (HANDOVER 13.4c). Both ran only when somebody
      # remembered, so a reintroduced leak was caught by nothing automatic.
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r data/prep/requirements.txt
      - run: python -m pytest
        working-directory: data/prep
      # The screen itself, run over the committed cases. Exits non-zero on a refusal,
      # so a case file that gains a clinical cross-reference fails the build rather
      # than quietly becoming a prediction case it must never be.
      - run: python data/prep/leakage_screen.py data/cases/slynd-drospirenone.json
      - run: npm run web:build
      # Cached because it is the slowest step in the job by an order of magnitude:
      # --with-deps apt-installs system libraries on a cold runner, which took
      # 12m24s against the ~2m the rest of the job needs. The key is pinned to the
      # lockfile so a Playwright version bump invalidates it.
      - uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium
      # The browser binary is cached but the OS libraries are not, so they are
      # installed separately on a hit. Skipping this entirely makes the e2e run
      # fail on a fresh runner image with a missing shared library.
      - if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium
      - run: npm run e2e
